root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_tourism_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1990
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_tour_occ_nin2"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow TOUR_OCC_NIN2 --output tour_occ_nin2_normalized.parquet"
        output: "tour_occ_nin2_normalized.parquet"
        filename: "tour_occ_nin2_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_tourism_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_tourism_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "TOUR_OCC_NIN2"
  theme: "Nights spent at tourist accommodation establishments by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "c_resid", "unit", "nace_r2", "geo"]
  description: "Nights spent at tourist accommodation establishments by NUTS 3 region"
