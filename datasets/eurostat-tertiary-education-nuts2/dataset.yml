root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_tertiary_education_nuts2"
  source_id: "eurostat"
  tags: [istruzione, istruzione-terziaria, eurostat, benchmark, nuts2]
  category: istruzione
  years: [2026]
  time_coverage:
    start_year: 2014
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_tgs00109"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "TGS00109"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - freq
    - unit
    - isced11
    - age
    - sex
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - isced11_label_en
    - age_label_en
    - sex_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit, isced11, age, sex]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, istruzione_terziaria_pct, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

registry:
  dataflow: "TGS00109"
  theme: "Tertiary educational attainment by NUTS 2 region"
  nuts_level: 2
  dimensions: ["freq", "unit", "isced11", "age", "sex", "geo"]
  description: "Tertiary educational attainment by NUTS 2 region"
