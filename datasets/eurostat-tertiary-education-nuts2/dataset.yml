root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_tertiary_education_nuts2"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2014
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_tgs00109"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow TGS00109 --output tgs00109_normalized.parquet"
        output: "tgs00109_normalized.parquet"
        filename: "tgs00109_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_tertiary_education_nuts2"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_tertiary_education_nuts2"

validation:
  fail_on_error: true

registry:
  dataflow: "TGS00109"
  theme: "Tertiary educational attainment by NUTS 2 region"
  nuts_level: 2
  dimensions: ["freq", "unit", "isced11", "age", "sex", "geo"]
  description: "Tertiary educational attainment by NUTS 2 region"
