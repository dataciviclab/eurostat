root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_pop_density_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1990
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_d3dens"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow DEMO_R_D3DENS --output demo_r_d3dens_normalized.parquet"
        output: "demo_r_d3dens_normalized.parquet"
        filename: "demo_r_d3dens_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_pop_density_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_pop_density_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "DEMO_R_D3DENS"
  theme: "Population density by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "unit", "geo"]
  description: "Population density by NUTS 3 region"
