root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_rd_expenditure_nuts2"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1980
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_rd_e_gerdreg"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow RD_E_GERDREG --output rd_e_gerdreg_normalized.parquet"
        output: "rd_e_gerdreg_normalized.parquet"
        filename: "rd_e_gerdreg_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_rd_expenditure_nuts2"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_rd_expenditure_nuts2"

validation:
  fail_on_error: true

registry:
  dataflow: "RD_E_GERDREG"
  theme: "GERD by sector of performance and NUTS 2 region"
  nuts_level: 2
  dimensions: ["freq", "sectperf", "unit", "geo"]
  description: "GERD by sector of performance and NUTS 2 region"
