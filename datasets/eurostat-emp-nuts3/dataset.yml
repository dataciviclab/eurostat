root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_emp_nuts3"
  source_id: "eurostat"
  tags: [economia, occupazione, lavoro, eurostat, benchmark, nuts3]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nama_10r_3empers"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "NAMA_10R_3EMPERS"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: nace_r2
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: NACE_R2
  - name: wstatus
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: WSTATUS
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    # Ordine colonne = header CSV del source sdmx (freq,unit,wstatus,nace_r2,geo)
    columns:
      freq: VARCHAR
      unit: VARCHAR
      wstatus: VARCHAR
      nace_r2: VARCHAR
      geo: VARCHAR
      year: INTEGER
      value: DOUBLE
      flag: VARCHAR
  required_columns:
    - freq
    - unit
    - wstatus
    - nace_r2
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - nace_r2_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit, wstatus, nace_r2]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, occupati_migliaia, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

registry:
  dataflow: "NAMA_10R_3EMPERS"
  theme: "Employment by NUTS 3 region, NACE sector and working status"
  nuts_level: 3
  dimensions: ["freq", "unit", "wstatus", "nace_r2", "geo"]
  description: "Employment by NUTS 3 region, NACE sector and working status"
