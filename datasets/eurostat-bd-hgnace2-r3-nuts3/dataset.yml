root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_bd_hgnace2_r3_nuts3"
  source_id: "eurostat"
  tags: [economia, demografia-imprese, imprese-high-growth, eurostat, benchmark, nuts3]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2008
    end_year: 2020

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_bd_hgnace2_r3"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "BD_HGNACE2_R3"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: indic_sb
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: INDIC_SB
  - name: nace_r2
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: NACE_R2
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    # Ordine colonne = header CSV del source sdmx (freq,indic_sb,nace_r2,geo)
    columns:
      freq: VARCHAR
      indic_sb: VARCHAR
      nace_r2: VARCHAR
      geo: VARCHAR
      year: INTEGER
      value: DOUBLE
      flag: VARCHAR
  required_columns:
    - freq
    - indic_sb
    - nace_r2
    - geo
    - year
    - freq_label_en
    - indic_sb_label_en
    - nace_r2_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, value]
        primary_key: [year, geo, indic_sb, nace_r2]
        min_rows: 100
      mart_sintesi:
        required_columns: [year, country, nascite_imprese, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

# Join pesanti su >4M righe: il default DuckDB 2GB causa OOM nel clean.
duckdb:
  memory_limit: "4GB"

registry:
  dataflow: "BD_HGNACE2_R3"
  theme: "Business demography and high growth enterprise by NACE Rev. 2 and NUTS 3 region (2008-2020)"
  nuts_level: 3
  dimensions: ["freq", "indic_sb", "nace_r2", "geo"]
  description: "Business demography and high growth enterprise by NACE Rev. 2 and NUTS 3 region (2008-2020)"
