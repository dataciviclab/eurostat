root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_demo_balance_nuts3"
  source_id: "eurostat"
  tags: [welfare-lavoro, demografia, bilancio-demografico, eurostat, benchmark, nuts3]
  category: welfare-lavoro
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_gind3"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "DEMO_R_GIND3"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: indic_de
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: INDIC_DE
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - freq
    - indic_de
    - geo
    - year
    - freq_label_en
    - indic_de_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, value]
        primary_key: [year, geo, indic_de]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, crescita_per_1000, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

registry:
  dataflow: "DEMO_R_GIND3"
  theme: "Population change - Demographic balance and crude rates at regional level (NUTS 3)"
  nuts_level: 3
  dimensions: ["freq", "indic_de", "geo"]
  description: "Population change - Demographic balance and crude rates at regional level (NUTS 3)"
