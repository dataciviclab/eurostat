root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_area_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2013
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_reg_area3"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow REG_AREA3 --output reg_area3_normalized.parquet"
        output: "reg_area3_normalized.parquet"
        filename: "reg_area3_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_area_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_area_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "REG_AREA3"
  theme: "Area by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "landuse", "unit", "geo"]
  description: "Area by NUTS 3 region"
