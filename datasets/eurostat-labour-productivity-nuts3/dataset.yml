root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_labour_productivity_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nama_10r_3nlp"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow NAMA_10R_3NLP --output nama_10r_3nlp_normalized.parquet"
        output: "nama_10r_3nlp_normalized.parquet"
        filename: "nama_10r_3nlp_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_labour_productivity_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_labour_productivity_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "NAMA_10R_3NLP"
  theme: "Nominal Labour productivity by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "na_item", "unit", "geo"]
  description: "Nominal Labour productivity by NUTS 3 region"
