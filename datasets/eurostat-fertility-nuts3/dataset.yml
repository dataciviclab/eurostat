root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_fertility_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2013
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_find3"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow DEMO_R_FIND3 --output demo_r_find3_normalized.parquet"
        output: "demo_r_find3_normalized.parquet"
        filename: "demo_r_find3_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_fertility_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_fertility_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "DEMO_R_FIND3"
  theme: "Fertility indicators by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "indic_de", "unit", "geo"]
  description: "Fertility indicators by NUTS 3 region"
