root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_pop_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1990
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_d2jan"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow DEMO_R_D2JAN --output demo_r_d2jan_normalized.csv"
        output: "demo_r_d2jan_normalized.csv"
        filename: "demo_r_d2jan_normalized.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    sample_size: -1
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_pop_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_pop_nuts3"

validation:
  fail_on_error: true
