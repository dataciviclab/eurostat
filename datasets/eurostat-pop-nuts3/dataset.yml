root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_pop_nuts3"
  source_id: "eurostat"
  tags: [welfare-lavoro, popolazione, residenti, eurostat, benchmark, nuts3]
  category: welfare-lavoro
  years: [2026]
  time_coverage:
    start_year: 1990
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_d2jan"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "DEMO_R_D2JAN"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    # Tipi espliciti: DuckDB sniffa 'sex' (M/F/T) come BOOLEAN con
    # auto_detect — qui i tipi sono dichiarati per evitare la conversione
    # errata (l'opzione auto_detect=false richiederebbe comunque columns).
    # Ordine colonne = header CSV del source sdmx per DEMO_R_D2JAN:
    # freq,unit,sex,age,geo (NOTA: unit PRIMA di sex — diverso da
    # DEMO_R_PJANGRP3 che ha freq,sex,unit,age,geo).
    columns:
      freq: VARCHAR
      unit: VARCHAR
      sex: VARCHAR
      age: VARCHAR
      geo: VARCHAR
      year: INTEGER
      value: DOUBLE
      flag: VARCHAR
  required_columns:
    - freq
    - unit
    - sex
    - age
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - sex_label_en
    - age_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit, sex, age]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, popolazione, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

# Join pesanti su ~5.9M righe: il default DuckDB 2GB causa OOM nel clean.
duckdb:
  memory_limit: "4GB"

registry:
  dataflow: "DEMO_R_D2JAN"
  theme: "Population on 1 January by age, sex and NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "sex", "unit", "age", "geo"]
  description: "Population on 1 January by age, sex and NUTS 3 region"
