root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_physicians_nuts2"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1993
    end_year: 2021

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_hlth_rs_physreg"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow HLTH_RS_PHYSREG --output hlth_rs_physreg_normalized.parquet"
        output: "hlth_rs_physreg_normalized.parquet"
        filename: "hlth_rs_physreg_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_physicians_nuts2"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_physicians_nuts2"

validation:
  fail_on_error: true

registry:
  dataflow: "HLTH_RS_PHYSREG"
  theme: "Physicians by NUTS 2 region"
  nuts_level: 2
  dimensions: ["freq", "unit", "geo"]
  description: "Physicians by NUTS 2 region"
