root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_physicians_nuts2"
  source_id: "eurostat"
  tags: [sanita, medici, eurostat, benchmark, nuts2]
  category: sanita
  years: [2026]
  time_coverage:
    start_year: 1993
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_hlth_rs_physreg"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow HLTH_RS_PHYSREG --output hlth_rs_physreg_normalized.parquet"
        output: "hlth_rs_physreg_normalized.parquet"
        filename: "hlth_rs_physreg_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - freq
    - unit
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps
    # (NaN flag, esp. recent years and small regions).
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit]
        min_rows: 5000
      mart_sintesi:
        required_columns: [year, country, medici_per_100k, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 100

validation:
  fail_on_error: true

registry:
  dataflow: "HLTH_RS_PHYSREG"
  theme: "Physicians by NUTS 2 region"
  nuts_level: 2
  dimensions: ["freq", "unit", "geo"]
  description: "Physicians by NUTS 2 region"
