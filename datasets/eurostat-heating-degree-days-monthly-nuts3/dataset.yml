root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_nrg_chddr2_m_nuts3"
  source_id: "eurostat"
  tags: [ambiente, clima, grado-giorni, mensile, eurostat, benchmark, nuts3]
  category: ambiente
  years: [2026]
  time_coverage:
    start_year: 1980
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nrg_chddr2_m"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "NRG_CHDDR2_M"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: indic_nrg
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: INDIC_NRG
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    # Ordine colonne = header CSV del source sdmx (freq,unit,indic_nrg,geo,month,...)
    columns:
      freq: VARCHAR
      unit: VARCHAR
      indic_nrg: VARCHAR
      geo: VARCHAR
      year: INTEGER
      month: INTEGER
      value: DOUBLE
      flag: VARCHAR
  required_columns:
    - freq
    - unit
    - indic_nrg
    - geo
    - year
    - month
    - freq_label_en
    - unit_label_en
    - indic_nrg_label_en
    - month_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps.
    not_null:
      - geo
      - year
      - month

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit, indic_nrg, month]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, hdd_mensile, rank_procapite_eu]
        primary_key: [year, month, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, month, first_year, last_year, cagr_pct]
        primary_key: [geo, month]
        min_rows: 100

validation:
  fail_on_error: true

registry:
  dataflow: "NRG_CHDDR2_M"
  theme: "Cooling and heating degree days by NUTS 3 region - monthly data"
  nuts_level: 3
  dimensions: ["freq", "unit", "indic_nrg", "geo", "month"]
  description: "Cooling and heating degree days by NUTS 3 region - monthly data"
