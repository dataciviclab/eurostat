root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_nrg_chddr2_m_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1980
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nrg_chddr2_m"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow NRG_CHDDR2_M --output nrg_chddr2_m_normalized.parquet --format parquet"
        output: "nrg_chddr2_m_normalized.parquet"
        filename: "nrg_chddr2_m_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_eurostat_nrg_chddr2_m_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_eurostat_nrg_chddr2_m_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "NRG_CHDDR2_M"
  theme: "Cooling and heating degree days by NUTS 3 region - monthly data"
  nuts_level: 3
  dimensions: ["freq", "unit", "indic_nrg", "geo"]
  description: "Cooling and heating degree days by NUTS 3 region - monthly data"
