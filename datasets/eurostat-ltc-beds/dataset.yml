root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_ltc_beds"
  source_id: "eurostat"
  tags: [sanita, rsa, posti-letto, long-term-care, eurostat, benchmark, paesi]
  category: sanita
  years: [2026]
  time_coverage:
    start_year: 1980
    end_year: 2025

# Beds in nursing and other residential long-term care facilities (LTC) —
# country-level, EU27 comparison. This is the residential-care counterpart of
# eurostat-hospital-beds-nuts2: same SDMX/ESTAT profile, same analytical marts.
#
# Units: NR = absolute beds, P_HTHAB = beds per 100k inhabitants (benchmark),
# HAB_P = inhabitants per bed (inverse density).
# NOTE: HLTH_RS_BDSNS (NUTS2, historical 1980-2021) was evaluated and excluded
# (2026-11-04): the NUTS2 panel ends ~2015, is unbalanced (BE 2010-2011,
# FR 2011-2013) and misses DE/NL/DK/PT/SI/SK/CY; its HP.2 definition covers
# only 50-63% of the Italian ISTAT residential beds. BDLTC (country) + ISTAT
# (dataset-incubator) cover the need.

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_hlth_rs_bdltc"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "HLTH_RS_BDLTC"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - freq
    - unit
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps
    # (missing flag, esp. recent years and small countries).
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit]
        min_rows: 500
      mart_sintesi:
        required_columns: [year, country, posti_letto_per_100k, rank_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 30

validation:
  fail_on_error: true

registry:
  dataflow: "HLTH_RS_BDLTC"
  theme: "Beds in nursing and other residential long-term care facilities"
  nuts_level: 0
  dimensions: ["freq", "unit", "geo"]
  description: "Beds in nursing and other residential long-term care facilities"
