root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_gdp_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nama_10r_3gdp"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow NAMA_10R_3GDP --output nama_10r_3gdp_normalized.parquet --format parquet"
        output: "nama_10r_3gdp_normalized.parquet"
        filename: "nama_10r_3gdp_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_gdp_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_gdp_nuts3"
  validate:
    table_rules:
      mart_gdp_nuts3:
        min_rows: 500

validation:
  fail_on_error: true


# Registry metadata for MCP client auto-discovery
registry:
  dataflow: "NAMA_10R_3GDP"
  theme: "Economy / GDP per capita"
  nuts_level: 3
  dimensions: ["freq", "unit", "geo"]
  description: "GDP at current market prices by NUTS 3 region"
