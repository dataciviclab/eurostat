root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_gdp_nuts3"
  source_id: "eurostat"
  tags: [economia, pil, eurostat, benchmark, nuts3]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_nama_10r_3gdp"
      type: "sdmx"
      args:
        agency: "ESTAT"
        flow: "NAMA_10R_3GDP"
      primary: true

support:
  - name: freq
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: FREQ
  - name: unit
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: UNIT
  - name: flag
    type: codelist
    provider: sdmx
    agency: ESTAT
    id: OBS_FLAG

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
    - freq
    - unit
    - geo
    - year
    - freq_label_en
    - unit_label_en
    - geo_label_en
    - nuts_level
    - country
    - value
    - flag
    - flag_desc_en
  validate:
    min_rows: 100
    # NOTE: `value` is NOT in not_null — Eurostat has legitimate coverage gaps
    # (NaN flag, ~4% of rows, esp. per-capita units and most recent year).
    not_null:
      - geo
      - year

mart:
  tables:
    - name: "mart_geo_benchmark"
      sql: "sql/mart_geo_benchmark.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_geo_benchmark"
    - "mart_sintesi"
    - "mart_trend"
  validate:
    table_rules:
      mart_geo_benchmark:
        required_columns: [year, geo, geo_label_en, country, unit, value]
        primary_key: [year, geo, unit]
        min_rows: 1000
      mart_sintesi:
        required_columns: [year, country, gdp_procapite, gdp_totale_mio, rank_procapite_eu]
        primary_key: [year, country]
        min_rows: 30
      mart_trend:
        required_columns: [geo, geo_label_en, first_year, last_year, cagr_pct]
        primary_key: [geo]
        min_rows: 1000

validation:
  fail_on_error: true


# Registry metadata for MCP client auto-discovery
registry:
  dataflow: "NAMA_10R_3GDP"
  theme: "Economy / GDP per capita"
  nuts_level: 3
  dimensions: ["freq", "unit", "geo"]
  description: "GDP at current market prices by NUTS 3 region"
