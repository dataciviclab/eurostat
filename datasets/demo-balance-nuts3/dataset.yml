root: "../../out"
schema_version: 1

dataset:
  name: "demo_balance_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_demo_r_gind3"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow DEMO_R_GIND3 --output demo_r_gind3_normalized.parquet"
        output: "demo_r_gind3_normalized.parquet"
        filename: "demo_r_gind3_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_demo_balance_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_demo_balance_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "DEMO_R_GIND3"
  theme: "Population change - Demographic balance and crude rates at regional level (NUTS 3) "
  nuts_level: 3
  dimensions: ["freq", "indic_de", "geo"]
  description: "Population change - Demographic balance and crude rates at regional level (NUTS 3) "
