root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_crime_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 1993
    end_year: 2007

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_crim_gen"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow CRIM_GEN --output crim_gen_normalized.csv"
        output: "crim_gen_normalized.csv"
        filename: "crim_gen_normalized.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_crime_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_crime_nuts3"

validation:
  fail_on_error: true

# ── Registry metadata (for MCP client + CLI auto-discovery) ──────────────────
registry:
  dataflow: "CRIM_GEN"
  theme: "Crime / Recorded offences"
  nuts_level: 3
  dimensions: ["freq", "iccs", "unit", "geo"]
  description: "Recorded crimes by NUTS 3 region and ICCS category"
