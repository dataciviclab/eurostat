root: "../../out"
schema_version: 1

dataset:
  name: "eurostat_crime_nuts3"
  source_id: "eurostat"
  years: [2026]
  time_coverage:
    start_year: 2008
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_crim_gen_reg"
      type: "script"
      args:
        command: "../../connectors/tsv_normalize.py --flow CRIM_GEN_REG --output crim_gen_reg_normalized.parquet --format parquet"
        output: "crim_gen_reg_normalized.parquet"
        filename: "crim_gen_reg_normalized.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_crime_nuts3"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_crime_nuts3"

validation:
  fail_on_error: true

registry:
  dataflow: "CRIM_GEN_REG"
  theme: "Police-recorded offences by NUTS 3 region"
  nuts_level: 3
  dimensions: ["freq", "iccs", "unit", "geo"]
  description: "Police-recorded offences by NUTS 3 region"
