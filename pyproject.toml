[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-eurostat"
version = "0.1.0"
description = "Eurostat datasets, connectors and pipelines for DataCivicLab"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Home = "https://github.com/dataciviclab/eurostat"

[tool.toolkit.extends]
source_id = "eurostat"
