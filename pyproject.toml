[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-eurostat"
version = "0.1.0"
description = "Eurostat datasets, connectors and pipelines for DataCivicLab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# Nessun package Python: il repo è dati + SQL + scripts (l'unico package,
# connectors/, è stato rimosso). Esplicito per evitare il flat-layout
# discovery di setuptools (datasets/registry/codelists come package).
[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "duckdb>=1.5.3,<2",
]

[project.urls]
Home = "https://github.com/dataciviclab/eurostat"

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, path contract, output CI",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (GCS, BigQuery, HTTP)",
    "pure_unit: logica pura non banale, zero side effect",
    "smoke: test che fa chiamate reali (richiede connettivita')",
]

[tool.toolkit.extends]
source_id = "eurostat"
