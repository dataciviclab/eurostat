[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-eurostat"
version = "0.1.0"
description = "Eurostat datasets, connectors and pipelines for DataCivicLab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
include = ["connectors*"]
# NOTE: eurostat-mcp/ is NOT a pip-installable package (hyphen in dir name,
# no __init__.py). It works via PYTHONPATH or directly python server.py.
# The conftest.py in eurostat-mcp/tests/ ensures tests run without PYTHONPATH.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
mcp = [
    "duckdb>=1.5.3,<2",
    "pyyaml>=6.0",
]

[project.urls]
Home = "https://github.com/dataciviclab/eurostat"

[tool.toolkit.extends]
source_id = "eurostat"
