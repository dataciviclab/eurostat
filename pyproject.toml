[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-eurostat"
version = "0.1.0"
description = "Eurostat datasets, connectors and pipelines for DataCivicLab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
include = ["connectors*", "eurostat*"]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
mcp = [
    "lab-connectors[mcp]>=0.15.1",
    "duckdb>=1.5.3,<2",
]

[project.scripts]
eurostat = "eurostat.cli:main"

[project.urls]
Home = "https://github.com/dataciviclab/eurostat"

[tool.toolkit.extends]
source_id = "eurostat"
