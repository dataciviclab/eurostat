name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: eurostat-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "eurostat"
      run-command: "toolkit run --batch batch.txt"
      detect-paths: "datasets"
      pre-run-command: "python scripts/update_codelists.py"
    secrets: inherit
