# Pipeline — eurostat
#
# Workflow unico post-merge + refresh. Fa tutto:
#   1. run dei dataset (cambiati se PR merged, TUTTI se schedule/manuale)
#   2. sync GCS (clean + mart)
#   3. registry → PR draft (via reusable `registry-update-pr-reusable`)
#
# Triggers:
#   - pull_request closed (merged) su datasets/** → run + sync dei dataset
#     cambiati
#   - schedule mensile (1° del mese 06:00 UTC) → run completo + sync
#     (refresh dati Eurostat anche senza PR)
#   - workflow_dispatch → manuale, slug opzionale

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset slugs (comma-separated) o vuoto per tutti"
        required: false
        type: string
      smoke:
        description: "Smoke mode (--sample-rows 1000, skips GCS sync)"
        required: false
        default: false
        type: boolean

concurrency:
  group: eurostat-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: git+https://github.com/dataciviclab/toolkit.git@v1.50.0 git+https://github.com/dataciviclab/lab-connectors.git -e ".[pipeline]"

      # ── Fetch latest codelists from Eurostat SDMX ────────────────────
      # I clean.sql fanno join con codelists/geo.csv (gerarchia NUTS, non
      # nel SDMX annotation set) e i support SDMX materializzano i parquet
      # a run-time — geo va aggiornato prima di ogni run.
      - name: Update codelists
        run: python scripts/update_codelists.py

      # ── Determinare i dataset da processare ─────────────────────────
      - name: Detect datasets to run
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_DATASETS: ${{ inputs.datasets }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR merged: solo i dataset cambiati
            gh pr view "$PR_NUMBER" --json files --jq ".files[].path" | \
              grep '^datasets/' | cut -d/ -f2 | sort -u > dirs.txt
          elif [ -n "$INPUT_DATASETS" ]; then
            # Manuale con slug espliciti — accetta sia trattini (cartella)
            # sia underscore (dataset.name, come nel registry/catalogo).
            echo "$INPUT_DATASETS" | tr ',' '\n' | sed 's/_/-/g' > dirs.txt
          else
            # Schedule/manuale senza slug: tutti
            find datasets -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort > dirs.txt
          fi
          # Filtra solo dir con dataset.yml
          DIRS=""
          while read -r d; do
            [ -n "$d" ] && [ -f "datasets/$d/dataset.yml" ] && DIRS="$DIRS datasets/$d"
          done < dirs.txt
          if [ -n "$DIRS" ]; then
            echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          else
            echo "dirs=" >> "$GITHUB_OUTPUT"
          fi

      # ── Run pipeline ─────────────────────────────────────────────────
      - name: Run datasets
        if: steps.detect.outputs.dirs != ''
        env:
          SMOKE: ${{ inputs.smoke && '--sample-rows 1000' || '' }}
        run: |
          YEAR=$(date +%Y)
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "=== $dir ==="
            toolkit run -c "$dir/dataset.yml" --years $YEAR $SMOKE
          done

      # ── GCS auth + sync ─────────────────────────────────────────────
      - name: Auth GCP
        id: gcs
        if: ${{ !inputs.smoke }}
        uses: dataciviclab/.github/actions/gcs-auth@main
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_EUROSTAT }}

      - name: Sync to GCS
        if: ${{ !inputs.smoke && steps.gcs.outputs.ready == 'true' && steps.detect.outputs.dirs != '' }}
        run: |
          for slug_dir in ${{ steps.detect.outputs.dirs }}; do
            slug=$(grep '^  name:' "$slug_dir/dataset.yml" | sed 's/.*: "//;s/"//')
            year=$(ls "out/data/clean/$slug/" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No clean output for $slug" && continue
            gsutil -m rsync -r "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/eurostat/$slug/"
            echo "✅ $slug clean synced"
          done
          for slug_dir in ${{ steps.detect.outputs.dirs }}; do
            slug=$(grep '^  name:' "$slug_dir/dataset.yml" | sed 's/.*: "//;s/"//')
            year=$(ls "out/data/mart/$slug/" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No mart output for $slug" && continue
            gsutil -m rsync -r "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/eurostat/$slug/"
            echo "✅ $slug mart synced"
          done

  # ── Registry → draft PR (componente condiviso) ──────────────────────
  # Escluso in smoke: il builder vedrebbe parquet sample (1000 righe).
  registry:
    if: ${{ !inputs.smoke }}
    needs: pipeline
    uses: dataciviclab/.github/.github/workflows/registry-update-pr-reusable.yml@main
    with:
      prefix: "eurostat"
      flat: true
      toolkit-install: "pip install git+https://github.com/dataciviclab/toolkit.git@v1.50.0"
