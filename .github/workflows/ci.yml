# CI per eurostat repo: test connector + lint
# I test non dipendono da toolkit — solo pytest su connectors/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: uv run ruff check connectors/ tests/

      - name: Test with pytest
        run: uv run pytest tests/ -v --tb=short
