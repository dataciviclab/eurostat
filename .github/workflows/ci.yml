# CI for eurostat repo: lint, test, validate configs, MCP tests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install git+https://github.com/dataciviclab/lab-connectors.git

      - name: Lint with ruff
        run: ruff check connectors/ tests/ eurostat-mcp/ eurostat-mcp/

      - name: Test connectors
        run: python -m pytest tests/ -v --tb=short

      - name: Test eurostat-mcp
        run: python -m pytest eurostat-mcp/tests/ -v --tb=short

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git

      - name: Validate all dataset configs
        run: |
          for cfg in $(find datasets -maxdepth 2 -name dataset.yml | sort); do
            echo "→ $cfg"
            toolkit inspect paths --config "$cfg" --year 2024 > /dev/null 2>&1
          done
          echo "✅ All configs valid"
