# CI for eurostat repo: lint, test, validate configs

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install -e ".[dev,pipeline]"

      - name: Lint with ruff
        run: ruff check connectors/ tests/

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git

      - name: Validate all dataset configs
        run: |
          for cfg in $(find datasets -maxdepth 2 -name dataset.yml | sort); do
            echo "→ $cfg"
            toolkit run preflight --config "$cfg" --years 2026 > /dev/null
          done
          echo "✅ All configs valid"
