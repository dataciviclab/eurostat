name: test-audit
on:
  pull_request:
    paths:
      - "**/*.py"
  push:
    branches: [main]
    paths:
      - "**/*.py"

permissions:
  contents: read

jobs:
  audit-markers:
    uses: dataciviclab/.github/.github/workflows/test-audit-reusable.yml@main
    with:
      test-dirs: "tests"
      extra-packages: -e ".[pipeline]"
