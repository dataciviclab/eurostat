name: publish

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset slugs to run (comma-separated), or 'all'"
        default: "all"
      smoke:
        description: "Smoke mode (--sample-rows 1000, skips GCS sync)"
        default: false
        type: boolean
  schedule:
    # First day of each month at 06:00 UTC
    - cron: '0 6 1 * *'

jobs:
  eurostat-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install -e ".[mcp]"
          chmod +x connectors/*.py

      # ── Dataset discovery ────────────────────────────────────────────
      # Discover all dataset configs dynamically: any datasets/*/dataset.yml
      - name: Discover datasets
        id: datasets
        run: |
          if [ "${{ inputs.datasets }}" = "all" ] || [ -z "${{ inputs.datasets }}" ]; then
            # Find all dataset configs, extract their directory paths
            DIRS=$(find datasets -maxdepth 2 -name dataset.yml -exec dirname {} \; | sort | tr '\n' ' ')
            echo "datasets=$DIRS" >> $GITHUB_OUTPUT
          else
            LIST=""
            for slug in $(echo "${{ inputs.datasets }}" | tr ',' ' '); do
              if [ -d "datasets/$slug" ]; then
                LIST="$LIST datasets/$slug"
              else
                echo "⚠️  Dataset '$slug' not found at datasets/$slug — skipping"
              fi
            done
            echo "datasets=$LIST" >> $GITHUB_OUTPUT
          fi

      # ── Fetch latest geo codelist from SDMX ───────────────────────────
      - name: Update geo codelist
        run: |
          python scripts/fetch_geo_sdmx.py

      # ── Run pipeline ─────────────────────────────────────────────────
      - name: Run datasets
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: 1
        run: |
          YEAR=$(date +%Y)
          SMOKE="${{ inputs.smoke && '--sample-rows 1000' || '' }}"
          for dir in ${{ steps.datasets.outputs.datasets }}; do
            echo "=== $dir ==="
            toolkit run full --config "$dir/dataset.yml" --years $YEAR $SMOKE
          done

      # ── GCS auth ─────────────────────────────────────────────────────
      - name: Auth GCP
        id: gcs
        if: ${{ !inputs.smoke }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_EUROSTAT }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "❌ GCP_SA_KEY_EUROSTAT secret not configured."
            echo "To enable automatic GCS publishing:"
            echo "  1. GCP Console → IAM → Service Accounts → Create"
            echo "     Name: eurostat-pipeline"
            echo "     ID: eurostat-pipeline@dataciviclab.iam.gserviceaccount.com"
            echo "  2. Add Storage Object Admin on:"
            echo "     - gs://dataciviclab-clean/eurostat/*"
            echo "     - gs://dataciviclab-mart/eurostat/*"
            echo "  3. GCP Console → IAM → Service Accounts → Keys → Add JSON key"
            echo "  4. GitHub repo → Settings → Secrets → Actions → Add"
            echo "     Name: GCP_SA_KEY_EUROSTAT"
            echo "     Value: content of the JSON key file"
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          # Supports both raw JSON and base64-encoded key
          if echo "$GCP_SA_KEY" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
            printf '%s\n' "$GCP_SA_KEY" > /tmp/gcp-key.json
          else
            printf '%s\n' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json 2>/dev/null
          fi
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          echo "ready=true" >> $GITHUB_OUTPUT

      # ── Sync to GCS (struttura senza anno, tutta la directory) ──
      - name: Sync to GCS
        if: ${{ !inputs.smoke && steps.gcs.outputs.ready == 'true' }}
        run: |
          # Clean: rsync l'intera directory (parquet + _run + _validate + metadata)
          #   out/data/clean/{slug}/{year}/ → gs://dataciviclab-clean/eurostat/{slug}/
          for slug_dir in ${{ steps.datasets.outputs.datasets }}; do
            slug=$(grep '^  name:' "$slug_dir/dataset.yml" | sed 's/.*: "//;s/"//')
            year=$(ls "out/data/clean/$slug/" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No clean output for $slug" && continue
            gsutil -m rsync -r "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/eurostat/$slug/"
            echo "✅ $slug clean synced to gs://dataciviclab-clean/eurostat/$slug/"
          done

          # Mart: rsync l'intera directory
          for slug_dir in ${{ steps.datasets.outputs.datasets }}; do
            slug=$(grep '^  name:' "$slug_dir/dataset.yml" | sed 's/.*: "//;s/"//')
            year=$(ls "out/data/mart/$slug/" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No mart output for $slug" && continue
            gsutil -m rsync -r "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/eurostat/$slug/"
            echo "✅ $slug mart synced to gs://dataciviclab-mart/eurostat/$slug/"
          done
