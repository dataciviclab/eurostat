# Generate registry/datasets.json after changes to datasets/ on main.
# If the artifact changed, opens a PR with the updated registry.
# Modelled after dataset-incubator's post-merge-candidate.yml pattern.

name: Publish Registry

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "registry/generate.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate datasets.json
        run: python registry/generate.py

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --exit-code registry/datasets.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Registry PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="registry/update-$(date +%Y%m%d%H%M%S)"
          git config user.name "dataciviclab-bot"
          git config user.email "bot@dataciviclab.it"
          git checkout -b "$BRANCH"
          git add registry/datasets.json
          git commit -m "registry: update datasets.json"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "registry: update datasets.json" \
            --body "Auto-generated by Publish Registry workflow after changes to \`datasets/\` or \`registry/generate.py\`.

            This PR updates \`registry/datasets.json\` to reflect the current state of dataset configurations on \`main\`.

            **Changes detected:** datasets added, removed, or metadata modified since last registry update." \
            --label "registry"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
